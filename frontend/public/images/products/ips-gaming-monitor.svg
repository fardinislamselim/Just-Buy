<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="300" fill="#F5F6F8"/>
  <!-- Monitor Display Screen -->
  <rect x="40" y="75" width="220" height="135" rx="6" fill="#18181B" stroke="#27272A" stroke-width="3"/>
  <rect x="48" y="83" width="204" height="119" rx="3" fill="#09090B"/>
  
  <!-- Subtle screen wallpaper graphic -->
  <path d="M48 180 L110 120 L160 160 L210 100 L252 145 L252 202 L48 202 Z" fill="url(#screenGrad)" opacity="0.4"/>
  <circle cx="215" cy="115" r="16" fill="#EF4444" opacity="0.6"/>

  <!-- Red Accent Gaming Logo/bar -->
  <path d="M142 206 L158 206" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Stand & Base -->
  <path d="M144 210 L142 245 L158 245 L156 210 Z" fill="#27272A"/>
  <path d="M100 252 L150 242 L200 252" stroke="#18181B" stroke-width="6" stroke-linecap="round"/>
  <path d="M105 251 L150 243 L195 251" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>

  <defs>
    <linearGradient id="screenGrad" x1="48" y1="83" x2="252" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
</svg>
